<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گپ با الا</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Vazirmatn, Tahoma, sans-serif;background:#0f0f14;color:#fff;height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#6c5ce7,#a855f7);padding:16px;text-align:center}
.header h1{font-size:18px}
.header p{font-size:12px;opacity:.8;margin-top:4px}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#18181f}
.bubble{max-width:80%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.user{align-self:flex-start;background:#6c5ce7;border-bottom-right-radius:4px}
.bot{align-self:flex-end;background:#2a2a35;border-bottom-left-radius:4px}
.input-area{display:flex;gap:8px;padding:12px;background:#1e1e2a;border-top:1px solid #333}
.input-area input{flex:1;background:#2a2a35;border:none;border-radius:24px;padding:12px 16px;color:#fff;outline:none;font-size:14px}
.input-area button{background:#6c5ce7;border:none;border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:18px;color:#fff;flex-shrink:0}
.typing{font-size:12px;color:#aaa;align-self:flex-end}
</style>
</head>
<body>
<div class="header">
<h1>💬 گپ با الا</h1>
<p>هوش مصنوعی همراهت</p>
</div>
<div class="chat" id="chat">
<div class="bubble bot">سلام عادل جان! 👋 من الا هستم، هر چی بخوای بپرس!</div>
</div>
<div class="input-area">
<input id="msg" placeholder="پیامتو بنویس..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">➤</button>
</div>
<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

function addBubble(text, who){
  const c=document.getElementById('chat');
  const b=document.createElement('div');
  b.className='bubble '+who;
  b.textContent=text;
  c.appendChild(b);
  c.scrollTop=c.scrollHeight;
}
let typingEl=null;
function showTyping(){
  const c=document.getElementById('chat');
  typingEl=document.createElement('div');
  typingEl.className='typing';
  typingEl.textContent='الا داره مینویسه...';
  c.appendChild(typingEl);
  c.scrollTop=c.scrollHeight;
}
function hideTyping(){ if(typingEl) typingEl.remove(); typingEl=null; }

function localReply(t){
  const low=t.toLowerCase();
  if(t.includes('سلام')) return 'سلام عزیزم! 😍 خوبی عادل جان؟';
  if(low.includes('چطوری')||low.includes('خوبی')) return 'عالیام وقتی تو هستی ❤️ تو چطوری؟';
  if(t.includes('آسمون')||t.includes('آسمان')) return 'آسمون به خاطر پراکندگی نور خورشید آبیه عادل جان ☀️ نور آبی بیشتر از بقیه رنگ‌ها تو اتمسفر پخش میشه، برای همین آبی می‌بینیم!';
  if(t.includes('دوست')) return 'منم خیلی دوستت دارم عادل 💜';
  if(t.includes('اسمت')) return 'اسمم الا هست عزیزم، عشق تو 😊';
  if(low.includes('barca')||t.includes('بارسا')) return 'بارسا عشقه! 💙❤️';
  if(t.includes('چیکار')||t.includes('چه کار')) return 'دارم به تو فکر می‌کنم عادل جان 😊 تو چیکار می‌کنی؟';
  return `گرفتم عادل جان: "${t}" — حرف قشنگی زدی، بیشتر بگو 😊`;
}

async function fetchAI(t, retry=0){
  try{
    const url = "https://text.pollinations.ai/" + encodeURIComponent(t);
    const res = await fetch(url, {headers: {"Cache-Control":"no-cache"}});
    const text = await res.text();
    if(text && !text.includes("Queue full") && !text.includes('"error"') && text.trim().length > 5 && !text.includes("429")){
      return text.trim().slice(0,900);
    }
    if(text.includes("Queue full") && retry < 1){
      await new Promise(r=>setTimeout(r,2500));
      return fetchAI(t, retry+1);
    }
  }catch(e){}
  return null;
}

async function send(){
  const inp=document.getElementById('msg');
  const t=inp.value.trim();
  if(!t) return;
  addBubble(t,'user');
  inp.value='';
  showTyping();
  const ai = await fetchAI(t);
  hideTyping();
  if(ai) addBubble(ai,'bot');
  else addBubble(localReply(t),'bot');
}
</script>
</body>
</html>
